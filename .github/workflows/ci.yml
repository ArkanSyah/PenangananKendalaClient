name: Continuous Integration

on:
  push:
    branches:
      - main
      - unitTesting
  pull_request:
    branches:
      - main
      - unitTesting

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Tests & Quality (Laravel)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webPenangananKendalaClientBE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, bcmath, curl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: webPenangananKendalaClientBE/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('webPenangananKendalaClientBE/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Backend PHPUnit Tests
        run: ./vendor/bin/phpunit

  frontend-ci:
    name: Frontend Tests, Lint & Build (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webPenangananKendalaClientFE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: webPenangananKendalaClientFE/package-lock.json

      - name: Install NPM dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Run Frontend Unit Tests (Vitest)
        run: npm test

      - name: Build Production Assets (Vite)
        run: npm run build

      - name: Run csService Unit & E2E API Tests
        working-directory: csService
        run: |
          cp .env.example .env || true
          npm ci
          npm test

  e2e-ci:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, bcmath, curl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: webPenangananKendalaClientBE/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('webPenangananKendalaClientBE/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        working-directory: webPenangananKendalaClientBE
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Backend for E2E (SQLite)
        working-directory: webPenangananKendalaClientBE
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_DATABASE=penanganan_kendala_client/DB_DATABASE=database\/database.sqlite/' .env
          php artisan migrate --force --seed

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            webPenangananKendalaClientFE/package-lock.json
            csService/package-lock.json

      - name: Install Frontend NPM dependencies
        working-directory: webPenangananKendalaClientFE
        run: npm ci

      - name: Prepare csService (AI Microservice)
        working-directory: csService
        run: |
          cp .env.example .env || true
          npm ci

      - name: Install Playwright Browsers & OS Dependencies
        working-directory: webPenangananKendalaClientFE
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: webPenangananKendalaClientFE
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: webPenangananKendalaClientFE/playwright-report/
          retention-days: 7

