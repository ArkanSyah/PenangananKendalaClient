name: Continuous Integration

on:
  push:
    branches:
      - main
      - unitTesting
  pull_request:
    branches:
      - main
      - unitTesting

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Tests & Quality (Laravel)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webPenangananKendalaClientBE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, bcmath, curl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: webPenangananKendalaClientBE/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('webPenangananKendalaClientBE/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Backend PHPUnit Tests
        run: ./vendor/bin/phpunit

  frontend-ci:
    name: Frontend Tests, Lint & Build (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webPenangananKendalaClientFE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: webPenangananKendalaClientFE/package-lock.json

      - name: Install NPM dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Run Frontend Unit Tests (Vitest)
        run: npm test

      - name: Build Production Assets (Vite)
        run: npm run build
